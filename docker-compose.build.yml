# Override OPCIONAL para buildar a imagem localmente em vez de puxar do registry.
# Uso (avançado — requer VPS >=4GB RAM ou swap; build leva ~15-25min num VPS):
#   docker compose -f docker-compose.prod.yml -f docker-compose.build.yml build
#   docker compose -f docker-compose.prod.yml up -d
#
# O caminho normal (leigo) NÃO usa este arquivo — puxa a imagem pronta do GHCR.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Sem args: a imagem é genérica (NEXT_PUBLIC_* viram placeholder no build
      # e os valores reais entram em runtime via env_file).
    image: ${APP_IMAGE:-lua-crm-app:local}
    pull_policy: never

  # O worker do agent-engine também é buildável localmente. Ele é OBRIGATÓRIO em
  # produção: é o único consumidor de `ai_agent.dispatch_requested`, então sem ele
  # o agente nunca responde (e não há erro na tela — só silêncio).
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: ${WORKER_IMAGE:-lua-crm-worker:local}
    pull_policy: never
