name: Publicar imagem Docker (GHCR)

# Builda as imagens GENÉRICAS e publica no GitHub Container Registry.
# O leigo puxa essas imagens no VPS (não builda lá). Roda nos runners do GitHub,
# então o build pesado (~6min) nunca cai no VPS do usuário.
#
# SÃO DUAS IMAGENS, e a segunda não é opcional: desde a convergência do
# agent-engine, o dispatcher nativo do app virou no-op e o ÚNICO consumidor de
# `ai_agent.dispatch_requested` é o serviço `worker` (Dockerfile.worker). VPS sem
# o worker = agente que nunca responde, em silêncio. Como o worker só existia com
# `build:` no compose, um VPS de 1 GB (o caso real desta instalação) não conseguia
# subi-lo: o build do projeto pede ≥4 GB. Publicar a imagem do worker aqui é o que
# torna o deploy possível nessas máquinas.

on:
  push:
    tags: ["v*"]
    branches: ["main"]
  release:
    types: [published]
  workflow_dispatch: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    strategy:
      # fail-fast desligado de propósito: se o worker quebrar, ainda queremos
      # saber se o app buildou (e vice-versa) — diagnosticar os dois de uma vez.
      fail-fast: false
      matrix:
        include:
          - nome: app
            dockerfile: Dockerfile
            sufixo: ""
          - nome: worker
            dockerfile: Dockerfile.worker
            sufixo: "-worker"
    name: build-and-push (${{ matrix.nome }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # O sufixo separa os repositórios no GHCR: `.../lua-crm` (app) e
          # `.../lua-crm-worker`. Mesmas tags nos dois, para que app e worker
          # subam SEMPRE na mesma versão — worker de uma versão e app de outra
          # é a receita para bug de contrato entre eles.
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.sufixo }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e push (imagem genérica — sem segredos)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # linux/amd64: o VPS HostGator e a imagem do WAHA são amd64.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache separado por imagem: chave compartilhada faria o worker
          # reaproveitar camadas do app (Dockerfiles diferentes) e invalidar tudo
          # a cada build alternado.
          cache-from: type=gha,scope=${{ matrix.nome }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nome }}
          # Sem build-args de segredo: a imagem é genérica (NEXT_PUBLIC_* viram
          # placeholder; valores reais entram em runtime no VPS do usuário).
